<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>canon²</title>

<link rel="icon" type="image/png" href="/favicon.png">

<style>
@font-face {
    font-family: 'MyriadPro';
    src: url('/fonts/converted/MyriadPro-Light.woff2') format('woff2'),
         url('/fonts/converted/MyriadPro-Light.woff') format('woff');
    font-weight: 300;
}

@font-face {
    font-family: 'MyriadPro';
    src: url('/fonts/converted/MyriadPro-Regular.woff2') format('woff2'),
         url('/fonts/converted/MyriadPro-Regular.woff') format('woff');
    font-weight: 400;
}

/* THEME VARIABLES */
:root {
    --bg: #ffffff;
    --text: #202122;
    --accent: #f78c20;
}

/* Light mode */
@media (prefers-color-scheme: light) {
    :root {
        --bg: #ffffff;
        --text: #f78c20;
    }
}

/* Dark mode */
@media (prefers-color-scheme: dark) {
    :root {
        --bg: #2e2e2e;
        --text: #f0b6e7;
    }
}

body {
    margin: 0;
    padding: 0;
    font-family: 'MyriadPro';
    font-weight: 400;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

a { color: var(--text); }

header {
    padding: 28px;
    text-align: center;
    font-size: 28px;
    font-weight: 400;
    letter-spacing: -0.015em;
}

.divider {
    width: 100vw;
    margin-left: calc(50% - 50vw);
    height: 1px;
    background: var(--text);
    opacity: .7;
}

/* NAV LINKS */
.nav-links {
    margin: 18px 0;
    text-align: center;
}

.nav-links a {
    color: var(--text);
    text-decoration: none;
    margin: 0 8px;
    font-size: 14px;
    opacity: .85;
}

.nav-links a:hover {
    text-decoration: underline;
}

/* GALLERY */
.gallery-wrap {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 32px 40px;
}

.gallery {
    column-count: 4;
    column-gap: 8px;
}

@media (max-width: 1200px) { .gallery { column-count: 3; } }
@media (max-width: 800px)  { .gallery { column-count: 2; } }
@media (max-width: 500px)  { .gallery { column-count: 1; } }

.gallery img {
    width: 100%;
    margin-bottom: 8px;
    cursor: pointer;
}

/* LIGHTBOX */
.lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}

.lightbox img {
    max-width: 92vw;
    max-height: 92vh;
}

.counter {
    position: absolute;
    bottom: 18px;
    left: 18px;
    font-size: 14px;
    font-weight: 300;
    color: #ffffff;
    opacity: 0.9;
}

.info-btn {
    position: absolute;
    bottom: 18px;
    right: 18px;
    background: rgba(0,0,0,0.75);
    color: #ffffff;
    border: none;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.08em;
    cursor: pointer;
}

.lightbox-meta {
    position: absolute;
    bottom: 56px;
    left: 50%;
    transform: translateX(-50%);
    width: min(520px, calc(100vw - 40px));
    background: rgba(0,0,0,0.78);
    padding: 20px 22px;
    display: none;
    font-size: 15px;
    font-weight: 300;
    line-height: 1.6;
    color: #ffffff;
}

.meta-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 28px;
    row-gap: 6px;
}

.meta-label { opacity: 0.65; }
.meta-value { text-align: right; }

.lightbox.show-meta .lightbox-meta {
    display: block;
}

footer {
    padding: 24px;
    text-align: center;
    font-size: 13px;
    font-weight: 300;
    opacity: 0.7;
}
</style>
</head>

<body>

<header>
    Tashkent, January 2026
</header>

<div class="divider"></div>

<div class="gallery-wrap">
    <div class="gallery" id="gallery"></div>
</div>

<div class="divider"></div>

<div class="nav-links">
    <a href="/">home</a> •
    <a href="/about">about</a> •
    <a href="https://instagram.com/can.on.canon">instagram</a>
</div>

<footer>
© 2025 — Photos licensed under CC BY-NC-SA 4.0
</footer>

<script>
let photos = [];
let currentIndex = 0;
let infoOpen = false;
let albumMeta = {};

fetch("/photos/tashkent.json")
  .then(r => r.json())
  .then(data => {
      photos = data.photos;
      albumMeta = data.albumMeta || {};
      const gallery = document.getElementById("gallery");

      data.photos.forEach((entry, idx) => {
          const img = document.createElement("img");
          const webpName = entry.FileName.replace(/\.(jpg|jpeg)$/i, ".webp");

          img.src = "/photos/thumbs/" + webpName;
          img.loading = "lazy";

          img.onerror = () => {
              img.onerror = null;
              img.src = "/photos/thumbs/" + entry.FileName;
          };

          img.onclick = () => openLightbox(idx);
          gallery.appendChild(img);
      });
  });

function renderMeta(entry) {
    const m = albumMeta;
    document.getElementById("lightboxMeta").innerHTML = `
        <div class="meta-grid">
            <div class="meta-label">Camera</div><div class="meta-value">${m.Model || ""}</div>
            <div class="meta-label">Lens</div><div class="meta-value">${m.LensModel || ""}</div>
            <div class="meta-label">Focal Length</div><div class="meta-value">${m.FocalLength || ""}</div>
            <div class="meta-label">Film</div><div class="meta-value">${m.Film || ""}</div>
            <div class="meta-label">ISO</div><div class="meta-value">${m.ISO ? "ISO " + m.ISO : ""}</div>
        </div>
    `;
}

function openLightbox(index) {
    currentIndex = index;
    const entry = photos[index];

    document.getElementById("lightboxImg").src =
        "/photos/full/" + entry.FileName;

    document.getElementById("counter").textContent =
        `(${index + 1}/${photos.length})`;

    renderMeta(entry);

    const lb = document.getElementById("lightbox");
    lb.style.display = "flex";
    lb.classList.toggle("show-meta", infoOpen);
}

document.getElementById("lightbox").addEventListener("click", e => {
    if (e.target.id === "lightbox") {
        e.currentTarget.style.display = "none";
        infoOpen = false;
    }
});

document.getElementById("infoBtn").onclick = e => {
    e.stopPropagation();
    infoOpen = !infoOpen;
    document.getElementById("lightbox").classList.toggle("show-meta", infoOpen);
};

document.addEventListener("keydown", e => {
    const lb = document.getElementById("lightbox");
    if (lb.style.display !== "flex") return;

    if (e.key === "ArrowRight" && currentIndex < photos.length - 1) {
        openLightbox(currentIndex + 1);
    }
    if (e.key === "ArrowLeft" && currentIndex > 0) {
        openLightbox(currentIndex - 1);
    }
    if (e.key === "Escape") {
        lb.style.display = "none";
        infoOpen = false;
    }
});
</script>
<div id="lightbox" class="lightbox">
    <img id="lightboxImg" alt="">
    <div id="counter" class="counter"></div>

    <button id="infoBtn" class="info-btn">INFO</button>

    <div id="lightboxMeta" class="lightbox-meta"></div>
</div>
</body>
</html>
