<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tashkent, January 2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    background: #0e0e11;
    color: #f78c20;
    font-family: 'MSSans', system-ui, sans-serif;
}

header {
    padding: 20px;
    text-align: right;
    font-size: 22px;
}

.gallery {
    padding: 20px;
}

.gallery img {
    height: 110px;
    margin: 4px;
    cursor: pointer;
}

footer {
    text-align: right;
    padding: 20px;
    font-size: 13px;
    opacity: .8;
}

/* LIGHTBOX */

.lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
}

.lightbox img {
    max-width: 92vw;
    max-height: 92vh;
}

.nav-btn {
    position: absolute;
    top: 50%;
    font-size: 40px;
    cursor: pointer;
    user-select: none;
}

#prevBtn { left: 20px; }
#nextBtn { right: 20px; }

.meta-grid {
    position: absolute;
    bottom: 20px;
    left: 20px;
    background: rgba(0,0,0,.6);
    padding: 10px;
    font-size: 13px;
}
.meta-label { opacity:.7; }
</style>
</head>

<body>

<header>Tashkent, January 2026</header>

<div class="gallery" id="gallery"></div>

<div class="lightbox" id="lightbox">
  <img id="lightboxImg">
  <div id="prevBtn" class="nav-btn">‹</div>
  <div id="nextBtn" class="nav-btn">›</div>
  <div id="lightboxMeta"></div>
</div>

<footer>
© 2025 — Photos licensed under CC BY-NC-SA 4.0
</footer>

<script>
let photos = [];
let albumMeta = {};
let currentIndex = 0;

fetch("/photos/tashkent.json")
  .then(r => r.json())
  .then(data => {
      photos = data.photos;
      albumMeta = data.albumMeta || {};

      const gallery = document.getElementById("gallery");

      data.photos.forEach((entry, idx) => {
          const img = document.createElement("img");

          const webpName =
              entry.FileName.replace(/\.(jpg|jpeg)$/i, ".webp");

          img.src = "/photos/thumbs/" + webpName;
          img.loading = "lazy";

          img.onerror = () => {
              img.onerror = null;
              img.src = "/photos/thumbs/" + entry.FileName;
          };

          img.onclick = () => openLightbox(idx);
          gallery.appendChild(img);
      });
  });

function openLightbox(index) {
    currentIndex = index;

    document.getElementById("lightboxImg").src =
        "/photos/full/" + photos[index].FileName;

    renderMeta();
    document.getElementById("lightbox").style.display = "flex";
}

function renderMeta() {
    const m = albumMeta;

    document.getElementById("lightboxMeta").innerHTML = `
      <div class="meta-grid">
        <div class="meta-label">Camera</div>
        <div>${m.Model || ""}</div>

        <div class="meta-label">Lens</div>
        <div>${m.LensModel || ""}</div>

        <div class="meta-label">Focal</div>
        <div>${m.FocalLength || ""}</div>

        <div class="meta-label">ISO</div>
        <div>${m.ISO ? "ISO " + m.ISO : ""}</div>

        ${m.Film ? `
        <div class="meta-label">Film</div>
        <div>${m.Film}</div>` : ""}
      </div>
    `;
}

// Close lightbox
document.getElementById("lightbox").onclick = (e) => {
    if (e.target.id === "lightbox")
        document.getElementById("lightbox").style.display = "none";
};

// Buttons
nextBtn.onclick = e => {
    e.stopPropagation();
    if (currentIndex < photos.length - 1)
        openLightbox(currentIndex + 1);
};

prevBtn.onclick = e => {
    e.stopPropagation();
    if (currentIndex > 0)
        openLightbox(currentIndex - 1);
};

// Keyboard
document.addEventListener("keydown", e => {
    if (lightbox.style.display !== "flex") return;

    if (e.key === "ArrowRight")
        nextBtn.onclick(e);

    if (e.key === "ArrowLeft")
        prevBtn.onclick(e);

    if (e.key === "Escape")
        lightbox.style.display = "none";
});
</script>

</body>
</html>
