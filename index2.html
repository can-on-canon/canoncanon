<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>canon²</title>

<link rel="icon" type="image/png" href="/favicon.png">

<style>
@font-face {
    font-family: 'MyriadPro';
    src: url('/fonts/converted/MyriadPro-Light.woff2') format('woff2'),
         url('/fonts/converted/MyriadPro-Light.woff') format('woff');
    font-weight: 300;
}

@font-face {
    font-family: 'MyriadPro';
    src: url('/fonts/converted/MyriadPro-Regular.woff2') format('woff2'),
         url('/fonts/converted/MyriadPro-Regular.woff') format('woff');
    font-weight: 400;
}

body {
    margin: 0;
    font-family: 'MyriadPro';
    background: #2e2e2e;
    color: #f0b6e7;
}

header {
    padding: 28px;
    text-align: center;
    font-size: 28px;
}

/* full‑width separators */
.divider {
    width: 100vw;
    margin-left: calc(50% - 50vw);
    height: 1.5px;              /* reduced thickness */
    background: #f0b6e7;
    opacity: .7;
}

.grid-wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px 24px 24px;
}

/* fixed grid regardless of item count */
.grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

@media (max-width: 900px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 500px) {
    .grid { grid-template-columns: 1fr; }
}

/* make images 75% of original size */
.grid a {
    display: flex;
    justify-content: center;
}

.grid a img {
    width: 75%;
    max-width: 75%;
    display: block;
    transition: opacity .15s;
}

.grid a:hover img {
    opacity: .8;
}

.nav-links {
    margin-top: 18px;
    text-align: center;
}

.nav-links a {
    color: #f0b6e7;
    text-decoration: none;
    margin: 0 8px;
    font-size: 14px;
    opacity: .85;
}

.nav-links a:hover {
    text-decoration: underline;
}

footer {
    padding: 20px;
    text-align: center;
    font-size: 13px;
    opacity: .7;
}
</style>
</head>

<body>

<header>canoncanon.cc</header>
<div class="divider"></div>

<div class="grid-wrap">
    <div class="grid">
        <a href="/albums/tashkent">
            <img src="/photos/thumbs2/tashkent.png" alt="tashkent">
        </a>
    </div>
</div>

<div class="divider"></div>

<div class="nav-links">
    <a href="/about">about</a> •
    <a href="https://instagram.com/can.on.canon">instagram</a>
</div>

<footer>
site under construction (rev. feb01)<br>© 2025 — canoncanon.cc
</footer>

</body>
</html>
